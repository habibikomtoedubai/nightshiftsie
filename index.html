<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Night Shift</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a12;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 800px;
      padding: 40px 30px;
      border: 1px solid #2a3345;
      border-radius: 18px;
      background: #121826;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 3rem;
      color: #ffca5f;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #dfe7f3;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Night Shift</h1>
    <p>
      Gece vardiyası, karanlık koridorlar, bilinmeyen sesler ve hayatta kalma mücadelesi.
      Night Shift, oyuncuyu sessizliğin, korkunun ve bilinmeyenin içinde bırakır.
    </p>
  </div>
</body>
</html>
